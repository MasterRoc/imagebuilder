name: Build daede image

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 把生成的固件发布到 GitHub Release
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      imagebuilder_url:
        description: ImmortalWrt ImageBuilder 下载地址
        required: true
        default: "https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/immortalwrt-imagebuilder-25.12.1-x86-64.Linux-x86_64.tar.zst"

      preflight:
        description: 构建前先检查软件包清单是否齐全
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      rootfs_partsize:
        description: 根文件系统分区大小（MB）
        required: true
        default: "4096"

permissions:
  contents: write

jobs:
  build:
    name: Build ImmortalWrt x86-64
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            zstd \
            rsync \
            file \
            wget \
            curl

      - name: Verify files
        run: |
          set -e

          echo "Checking build-image.sh..."
          test -f scripts/build-image.sh

          echo "Checking 99-custom.sh..."
          test -f files/etc/uci-defaults/99-custom.sh

          echo "Checking build-image.sh syntax..."
          bash -n scripts/build-image.sh

          echo "Checking 99-custom.sh syntax..."
          sh -n files/etc/uci-defaults/99-custom.sh

          chmod +x scripts/build-image.sh
          chmod +x files/etc/uci-defaults/99-custom.sh

          echo "Files OK."

      - name: Build image
        env:
          IMAGEBUILDER_URL: ${{ inputs.imagebuilder_url }}
          PREFLIGHT: ${{ inputs.preflight }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
        run: |
          set -eux

          ./scripts/build-image.sh

      - name: Show output
        run: |
          echo "========================================"
          echo "Build output"
          echo "========================================"

          ls -lah out/

          echo
          echo "SHA256:"
          cat out/sha256sums 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: daede-x86-64
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: daede-${{ github.run_number }}
          name: daede 固件 ${{ github.run_number }}
          artifacts: out/*
          allowUpdates: true
          replacesArtifacts: true
