
name: Build ImmortalWrt x86-64 image

on:
  workflow_dispatch:
    inputs:
      version:
        description: ImmortalWrt 版本，留空自动使用最新正式版，例如 25.12.1
        required: false
        default: ""
        type: string

      rootfs_partsize:
        description: 根文件系统分区大小（MB）
        required: true
        default: "4096"
        type: string


permissions:
  contents: write


jobs:
  build:
    name: Build ImmortalWrt x86-64
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v6


      # ========================================
      # Install dependencies
      # ========================================

      - name: Install host dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zstd \
            file \
            wget \
            curl \
            qemu-utils \
            genisoimage


      # ========================================
      # Verify files 写入自用默认规则
      # ========================================

      - name: Verify files
        run: |
          set -e

          echo "Checking 99-custom.sh..."
          test -f files/etc/uci-defaults/99-custom.sh

          echo "Checking 99-custom.sh syntax..."
          sh -n files/etc/uci-defaults/99-custom.sh

          chmod +x files/etc/uci-defaults/99-custom.sh

          echo "Checking build-image.sh..."
          test -f scripts/build-image.sh

          echo "Checking build-image.sh syntax..."
          bash -n scripts/build-image.sh

          chmod +x scripts/build-image.sh

          echo "Files OK."


      - name: Build image
        env:
          VERSION: ${{ inputs.version }}
          PREFLIGHT: "true"
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
          OUT_DIR: ${{ github.workspace }}/out
          TARGET: x86/64
          PROFILE: generic
        run: |
          set -e

          chmod +x scripts/build-image.sh

          echo "Requested ImmortalWrt version: ${VERSION:-latest}"

          scripts/build-image.sh


      - name: Read build information
        id: build_info
        shell: bash
        run: |
          set -e

          if [ ! -f "out/.build_info" ]; then
            echo "ERROR: out/.build_info not found."
            exit 1
          fi

          VERSION="$(sed -n 's/^version=//p' out/.build_info)"
          TARGET="$(sed -n 's/^target=//p' out/.build_info)"
          PROFILE="$(sed -n 's/^profile=//p' out/.build_info)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: ImmortalWrt version is empty."
            exit 1
          fi

          echo "ImmortalWrt version: $VERSION"
          echo "Target: $TARGET"
          echo "Profile: $PROFILE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"


      # ========================================
      # Verify output
      # ========================================

      - name: Verify build output
        run: |
          set -e

          echo "Build output:"
          ls -lah out

          test -f out/BUILD-MANIFEST.txt
          test -f out/sha256sums


      # ========================================
      # Upload artifact
      # ========================================

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-${{ steps.build_info.outputs.version }}-x86-64
          path: out/*
          if-no-files-found: error


      # ========================================
      # Publish GitHub Release
      # ========================================

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: immortalwrt-${{ steps.build_info.outputs.version }}-run${{ github.run_number }}
          name: ImmortalWrt ${{ steps.build_info.outputs.version }} 固件
          artifacts: out/*
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: out/BUILD-MANIFEST.txt
