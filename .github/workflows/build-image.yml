name: Build Media Saber FPK

on:
  push:
    branches:
      - main
    paths:
      - "manifest"
      - "app/**"
      - "cmd/**"
      - "config/**"
      - "wizard/**"
      - "fnos/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

  workflow_dispatch:
    inputs:
      media_saber_tag:
        description: "Media Saber 版本，留空自动获取最新 Stable Release"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: media-saber-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # ============================================================
  # fnpack 官方版本
  # ============================================================
  FNPACK_VERSION: "1.2.3"

  # fnpack 1.2.3 Linux AMD64 SHA256
  FNPACK_SHA256: "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"

jobs:
  build:

    name: Build Media Saber FPK

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. Install dependencies
      # ==========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            tar \
            gzip \
            xz-utils \
            shellcheck \
            coreutils

          echo "======================================"
          echo "Environment"
          echo "======================================"

          uname -a
          echo

          echo "Python:"
          python3 --version

          echo "Curl:"
          curl --version | head -n 1

          echo "JQ:"
          jq --version

          echo "ShellCheck:"
          shellcheck --version | head -n 1


      # ==========================================================
      # 3. Prepare scripts
      # ==========================================================
      - name: Prepare scripts
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/*.sh

          if [ -d "fnos/cmd" ]; then
            chmod +x fnos/cmd/*
          fi

          echo "======================================"
          echo "Build scripts"
          echo "======================================"

          find scripts \
            -maxdepth 2 \
            -type f \
            -print

          if [ -d "fnos/cmd" ]; then
            echo
            echo "fnos/cmd:"
            find fnos/cmd \
              -maxdepth 2 \
              -type f \
              -print
          fi


      # ==========================================================
      # 4. Fetch Media Saber upstream
      # ==========================================================
      - name: Fetch upstream
        shell: bash
        env:
          MEDIA_SABER_TAG: ${{ inputs.media_saber_tag }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Fetch Media Saber upstream"
          echo "======================================"

          if [ -n "${MEDIA_SABER_TAG:-}" ]; then
            echo "Requested tag:"
            echo "${MEDIA_SABER_TAG}"
          else
            echo "Requested tag: latest Stable"
          fi

          ./scripts/fetch-upstream.sh


      # ==========================================================
      # 5. Read upstream version
      # ==========================================================
      - name: Read upstream version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Read upstream version"
          echo "======================================"

          if [ ! -f "work/upstream_tag" ]; then
            echo "ERROR: work/upstream_tag does not exist"

            echo
            echo "Current work directory:"
            find work \
              -maxdepth 3 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          TAG="$(tr -d '[:space:]' < work/upstream_tag)"

          if [ -z "$TAG" ]; then
            echo "ERROR: upstream tag is empty"
            exit 1
          fi

          VERSION="${TAG//_/.}"

          echo "Upstream tag:"
          echo "$TAG"

          echo
          echo "Package version:"
          echo "$VERSION"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 6. Show manifest
      # ==========================================================
      - name: Show manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Manifest"
          echo "======================================"

          if [ -f "manifest" ]; then
            cat manifest

          elif [ -f "fnos/manifest" ]; then
            cat fnos/manifest

          else
            echo "WARNING: manifest not found at:"
            echo "  ./manifest"
            echo "  ./fnos/manifest"
          fi


      # ==========================================================
      # 7. ShellCheck
      # ==========================================================
      - name: Check shell scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ShellCheck"
          echo "======================================"

          shellcheck scripts/*.sh fnos/cmd/* || true


      # ==========================================================
      # 8. Install official fnpack
      # ==========================================================
      - name: Install fnpack
        shell: bash
        run: |
          set -euo pipefail

          FNPACK_URL="https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          FNPACK_PATH="${RUNNER_TEMP}/fnpack"

          echo "======================================"
          echo "Install official fnpack"
          echo "======================================"

          echo "Version:"
          echo "${FNPACK_VERSION}"

          echo
          echo "Download URL:"
          echo "${FNPACK_URL}"

          echo
          echo "Expected SHA256:"
          echo "${FNPACK_SHA256}"

          # ------------------------------------------------------
          # Download
          # ------------------------------------------------------
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 300 \
            "${FNPACK_URL}" \
            --output "${FNPACK_PATH}"

          # ------------------------------------------------------
          # SHA256
          # ------------------------------------------------------
          echo
          echo "Checking fnpack SHA256..."

          printf '%s  %s\n' \
            "${FNPACK_SHA256}" \
            "${FNPACK_PATH}" \
            | sha256sum --check

          # ------------------------------------------------------
          # Permission
          # ------------------------------------------------------
          chmod 755 "${FNPACK_PATH}"

          # ------------------------------------------------------
          # IMPORTANT:
          # 安装到系统 PATH
          # build-fpk.sh 直接执行 fnpack 时才能找到
          # ------------------------------------------------------
          sudo install \
            -m 755 \
            "${FNPACK_PATH}" \
            /usr/local/bin/fnpack

          echo
          echo "fnpack installed to:"
          echo "/usr/local/bin/fnpack"


      # ==========================================================
      # 9. Verify fnpack
      # ==========================================================
      - name: Verify fnpack
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Verify fnpack"
          echo "======================================"

          echo "PATH:"
          echo "$PATH"

          echo
          echo "fnpack location:"
          command -v fnpack

          echo
          echo "fnpack file:"
          ls -lh "$(command -v fnpack)"

          echo
          echo "fnpack help:"
          fnpack --help

          echo
          echo "fnpack build help:"
          fnpack build --help || true


      # ==========================================================
      # 10. Build FPK
      # ==========================================================
      - name: Build FPK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Build Media Saber FPK"
          echo "======================================"

          echo "Using fnpack:"
          command -v fnpack

          echo
          echo "fnpack:"
          fnpack --help >/dev/null

          echo
          echo "Running:"
          echo "./scripts/build-fpk.sh"

          ./scripts/build-fpk.sh


      # ==========================================================
      # 11. Validate FPK
      # ==========================================================
      - name: Validate FPK
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Validate FPK"
          echo "======================================"

          ./scripts/validate.sh


      # ==========================================================
      # 12. Check build output
      # ==========================================================
      - name: Check build output
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Build output"
          echo "======================================"

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory does not exist"
            exit 1
          fi

          echo
          echo "Files:"
          find dist \
            -maxdepth 2 \
            -type f \
            -printf '%p  %s bytes\n' \
            | sort

          echo

          FPK_COUNT="$(
            find dist \
              -maxdepth 1 \
              -type f \
              -name '*.fpk' \
              | wc -l
          )"

          echo "FPK count: ${FPK_COUNT}"

          if [ "${FPK_COUNT}" -eq 0 ]; then
            echo "ERROR: No .fpk package generated"
            exit 1
          fi


      # ==========================================================
      # 13. Generate SHA256SUMS
      # ==========================================================
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Generate SHA256SUMS"
          echo "======================================"

          cd dist

          rm -f SHA256SUMS

          sha256sum ./*.fpk > SHA256SUMS

          echo
          cat SHA256SUMS


      # ==========================================================
      # 14. Upload artifact
      # ==========================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-saber-fpk-v${{ steps.version.outputs.version }}
          path: |
            dist/*.fpk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14


      # ==========================================================
      # 15. Job summary
      # ==========================================================
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "Media Saber Build Summary"
          echo "======================================"

          echo "Upstream tag:"
          echo "${{ steps.version.outputs.tag }}"

          echo
          echo "Version:"
          echo "${{ steps.version.outputs.version }}"

          echo
          echo "FPK files:"
          find dist \
            -maxdepth 1 \
            -type f \
            -name '*.fpk' \
            -print 2>/dev/null || true
