
name: Build immortalwrt-x86-64 image

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 把生成的固件发布到 GitHub Release
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      preflight:
        description: 构建前先检查软件包清单是否齐全
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      rootfs_partsize:
        description: 根文件系统分区大小（MB）
        required: true
        default: "4096"


permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v6


      # ========================================
      # Install host dependencies
      # ========================================

      - name: Install host dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zstd \
            file \
            wget \
            curl \
            qemu-utils \
            genisoimage


      # ========================================
      # Verify files
      # ========================================

      - name: Verify files
        run: |
          set -e

          echo "Checking 99-custom.sh..."
          test -f files/etc/uci-defaults/99-custom.sh

          echo "Checking 99-custom.sh syntax..."
          sh -n files/etc/uci-defaults/99-custom.sh

          chmod +x files/etc/uci-defaults/99-custom.sh

          echo "Checking build-image.sh..."
          test -f scripts/build-image.sh

          echo "Checking build-image.sh syntax..."
          bash -n scripts/build-image.sh

          chmod +x scripts/build-image.sh

          echo "Files OK."


      # ========================================
      # Build image
      #
      # VERSION 不设置
      # IMAGEBUILDER_URL 不设置
      #
      # 由 scripts/build-image.sh 自动：
      #
      #   1. 检测 ImmortalWrt 最新正式版本
      #   2. 自动生成对应 ImageBuilder URL
      #   3. 下载对应版本 ImageBuilder
      #   4. 使用对应版本 package feeds
      #   5. 构建镜像
      # ========================================

      - name: Build image
        env:
          PREFLIGHT: ${{ inputs.preflight }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
          OUT_DIR: ${{ github.workspace }}/out
          TARGET: x86/64
          PROFILE: generic
        run: |
          set -e

          chmod +x scripts/build-image.sh

          scripts/build-image.sh


      # ========================================
      # Read actual ImmortalWrt version
      #
      # build-image.sh 会生成：
      #
      # out/.build_info
      #
      # 里面包含：
      #
      # version=25.12.x
      # target=x86/64
      # profile=generic
      # imagebuilder_url=...
      # ========================================

      - name: Read build information
        id: build_info
        run: |
          set -e

          test -f out/.build_info

          VERSION="$(sed -n 's/^version=//p' out/.build_info)"
          TARGET="$(sed -n 's/^target=//p' out/.build_info)"
          PROFILE="$(sed -n 's/^profile=//p' out/.build_info)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Unable to read ImmortalWrt version."
            exit 1
          fi

          echo "ImmortalWrt version: $VERSION"
          echo "Target: $TARGET"
          echo "Profile: $PROFILE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"


      # ========================================
      # Prepare artifact
      #
      # 删除内部构建信息文件
      # 避免上传到 Artifact / Release
      # ========================================

      - name: Prepare release files
        run: |
          set -e

          rm -f out/.build_info
          rm -f out/.extra_packages

          echo "Final output:"
          ls -lah out


      # ========================================
      # Upload artifact
      # ========================================

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-${{ steps.build_info.outputs.version }}-x86-64
          path: out/*
          if-no-files-found: error


      # ========================================
      # Publish GitHub Release
      # ========================================

      - name: Publish release
        if: inputs.publish_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: immortalwrt-${{ steps.build_info.outputs.version }}-run${{ github.run_number }}
          name: ImmortalWrt ${{ steps.build_info.outputs.version }} 固件
          artifacts: out/*
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: out/BUILD-MANIFEST.txt
```
