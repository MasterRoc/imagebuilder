
name: Build ImmortalWrt x86-64 image

on:
  workflow_dispatch:
    inputs:
      version:
        description: ImmortalWrt 版本，留空自动使用最新正式版，例如 25.12.1
        required: false
        default: ""
        type: string
      rootfs_partsize:
        description: 根文件系统分区大小（MB）
        required: true
        default: "4096"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ImmortalWrt x86-64
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-distutils \
            rsync unzip zstd file wget curl qemu-utils genisoimage

      # ========================================
      # Verify files 写入自用默认规则
      # ========================================

      - name: Verify files
        run: |
          set -e

          echo "Checking 99-custom.sh..."
          test -f files/etc/uci-defaults/99-custom.sh

          echo "Checking 99-custom.sh syntax..."
          sh -n files/etc/uci-defaults/99-custom.sh

          chmod +x files/etc/uci-defaults/99-custom.sh

          echo "Checking build-image.sh..."
          test -f scripts/build-image.sh

          echo "Checking build-image.sh syntax..."
          bash -n scripts/build-image.sh

          chmod +x scripts/build-image.sh

          echo "Files OK."

      - name: Build image
        env:
          VERSION: ${{ inputs.version }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
          TARGET: x86/64
          PROFILE: generic
        run: |
          set -ex
          ./scripts/build-image.sh

      - name: Prepare release
        id: release
        run: |
          set -e
          mkdir -p release
          
          # 查找并复制文件
          find . -name 'generic-squashfs-combined-efi.img.gz' -exec cp {} release/squashfs-efi.img.gz \;
          find . -name 'generic-squashfs-combined-efi.vmdk' -exec cp {} release/squashfs-efi.vmdk \;
          
          # 验证文件存在
          test -f release/squashfs-efi.img.gz || { echo "ERROR: squashfs-efi.img.gz not found"; exit 1; }
          test -f release/squashfs-efi.vmdk || { echo "ERROR: squashfs-efi.vmdk not found"; exit 1; }
          
          # 显示文件信息
          ls -lh release/
          
          # 提取版本号
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL "https://downloads.immortalwrt.org/releases/" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          fi
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Build Version: $VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-${{ steps.release.outputs.version }}-x86-64
          path: release/*
          if-no-files-found: error

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: immortalwrt-${{ steps.release.outputs.version }}-run${{ github.run_number }}
          name: ImmortalWrt ${{ steps.release.outputs.version }} x86-64
          artifacts: release/*
          allowUpdates: true
          replacesArtifacts: true
          body: |
            ImmortalWrt x86-64 Build
            - Target: x86/64
            - Profile: generic
            - Rootfs Partition Size: ${{ inputs.rootfs_partsize }} MB
